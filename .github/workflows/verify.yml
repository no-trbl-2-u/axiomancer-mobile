name: verify

# Run the hermetic verify gate (lint + typecheck + jest) and the
# bundler smoke test on every push to `main` and every PR against
# `main`. This is the remote complement to local `npm run verify`:
# the local gate runs on the maintainer's workstation and can miss
# regressions that only surface on a different Node version, native
# dep, or cache state. Two jobs run in parallel.
#
# The bundler smoke job uses `expo export --platform web` rather
# than booting Metro because it terminates cleanly. See
# `scripts/smoke-bundler.mjs` for the exit-code contract.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (lint + typecheck + jest)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run verify gate
        run: npm run verify

  smoke-bundler:
    name: smoke-bundler (expo export web)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run bundler smoke
        run: npm run smoke:bundler
        env:
          # See scripts/smoke-bundler.mjs DEFAULT_TIMEOUT_MS — 4 min
          # is the per-export budget. Bumping to 8 min here gives the
          # cold-cache CI runner a wider window than a warm laptop.
          SMOKE_BUNDLER_TIMEOUT_MS: '480000'
